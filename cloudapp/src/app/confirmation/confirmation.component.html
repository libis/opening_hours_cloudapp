<h2 mat-dialog-title>Delete field</h2>
<mat-dialog-content>
  <p class="emphasis">Are your sure you wish to delete this field ?</p><p class="emphasis">This cannot be undone !!!</p>
</mat-dialog-content>
<mat-dialog-actions style="float:right;margin-top:40px">
    <button class="mat-raised-button"(click)="no()" style="margin-right:5px">No</button>
    <button class="mat-raised-button mat-primary"(click)="yes()">Yes</button>
</mat-dialog-actions>
